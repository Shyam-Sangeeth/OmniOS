<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- OmniOS TV: a screen in the OmniOS purple, with the play mark on it. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A83FF"/>
      <stop offset="1" stop-color="#4B43D9"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <path d="M100 30 L128 58 L156 30" fill="none" stroke="#C8C4FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- body and screen -->
  <rect x="20" y="58" width="216" height="150" rx="22" fill="#1E1B3A"/>
  <rect x="36" y="74" width="184" height="118" rx="12" fill="url(#screen)"/>
  <!-- play mark -->
  <path d="M112 106 L112 160 L156 133 Z" fill="#FFFFFF"/>
  <!-- stand -->
  <rect x="84" y="214" width="88" height="14" rx="7" fill="#1E1B3A"/>
</svg>
