# OmniOS's RetroArch settings, laid over the user's own for games the launcher
# starts (retroarch --appendconfig=/usr/share/omnios/retroarch.cfg; see
# src/omnios/Router.cpp). RetroArch started any other way does not read this.

video_fullscreen = "true"
# The launcher raises itself over a game on the Guide button; the game waits
# rather than playing on behind it.
pause_nonactive = "true"

# Controllers through SDL, as in the launcher. RetroArch's default (udev)
# needs a profile per controller model from retroarch-joypad-autoconfig,
# which only the AUR has, so with it every pad was dead in every game. SDL's
# own database maps the common pads, and any pad without a profile gets
# RetroArch's built-in "Standard Gamepad" mapping, by position.
input_joypad_driver = "sdl2"

# A way back with a controller alone: Start + Select opens RetroArch's menu,
# where "Quit RetroArch" returns to OmniOS. On a keyboard, Esc quits at once.
input_menu_toggle_gamepad_combo = "4"
quit_press_twice = "false"
input_exit_emulator = "escape"

# The menu's look; its assets are on the image (retroarch-assets-ozone).
menu_driver = "ozone"

# Settings changed in the menu while a game plays are kept in RetroArch's own
# file, not in this one, and these still win next time.
config_save_on_exit = "true"
