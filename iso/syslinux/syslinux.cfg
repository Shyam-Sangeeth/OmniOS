# BIOS boot menu. mkarchiso substitutes %INSTALL_DIR%, %ARCH% and
# %ARCHISO_LABEL% when it copies this onto the image, and generates
# isolinux/isolinux.cfg pointing here.
#
# The kernel and initramfs filenames carry the -linux-zen suffix because that
# is the kernel package in packages.x86_64. If the kernel is ever swapped
# (linux-cachyos, OmniOS.md §6.4.6), these two lines and the UEFI entry beside
# them are what change.

SERIAL 0 115200

# No UI module. menu.c32 paints a full blue menu screen for the whole timeout
# on every boot, which flashes before the splash takes over — on a console that
# should just turn on and play, that is the first thing a user sees.
#
# PROMPT 0 with a short TIMEOUT draws nothing at all and boots the default.
# The entries below are still selectable: press Esc during the timeout to get
# a boot prompt and type a label (omnios-safe, omnios-console).
PROMPT 0
TIMEOUT 20
DEFAULT omnios

# cow_spacesize is the size of the writable overlay the live session gets, and
# archiso's default is far too small for a machine with a store on it. Fetching
# Flathub's catalogue alone failed with:
#
#   Delta requires 86.4 MB free space, but only 84.8 MB available
#
# It is a tmpfs cap, not a reservation, so asking for 2G costs nothing until
# something uses it.
LABEL omnios
    MENU LABEL OmniOS (linux-zen)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=2G archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false

LABEL omnios-safe
    MENU LABEL OmniOS (safe graphics)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=2G archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off nomodeset

LABEL omnios-console
    MENU LABEL OmniOS (console only, no launcher)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=2G archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off omnios.nolauncher

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power off
    COM32 poweroff.c32
