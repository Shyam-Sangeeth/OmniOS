# Phase 3.3 (OmniOS.md §5.3.3). Hyprland exists here only to hold a Wayland
# surface for the launcher; the custom wlroots compositor replaces it later.
#
# Written against Hyprland 0.56, which is what the ISO ships. Options here were
# checked against a running instance — the first boot reported five config
# errors from syntax that older Hyprland accepted.

# Start the launcher inside a terminal directly, rather than letting the
# launcher find one for itself. Hyprland does not guarantee WAYLAND_DISPLAY is
# set in an exec-once child's environment, and the launcher used that variable
# to decide whether to open a terminal — so it silently wrote to a stdout that
# went nowhere and exited.
exec-once = foot --app-id=omni-launcher --fullscreen omni-launcher

# If that fails, leave something on screen saying so instead of a blank desktop.
exec-once = sh -c 'sleep 5; pgrep -x foot >/dev/null || foot --app-id=omni-fallback sh -c "echo omni-launcher did not start; echo; cat /tmp/omnios-session.log 2>/dev/null; exec bash"'

# The launcher owns the whole screen. No decorations, no gaps, no desktop.
# windowrulev2 was merged back into windowrule and the v2 name is deprecated;
# the class matched here is foot's --app-id, not the script's name.
windowrule = fullscreen, class:omni-launcher
windowrule = noborder, class:omni-launcher

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0

    # These are nested blocks. Written inline as `blur { enabled = false }` on
    # one line, Hyprland does not parse them and reports the option as missing.
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    # 150ms tile focus, matching the UI spec in OmniOS.md §12.
    bezier = omni, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, omni
    animation = fade, 1, 3, omni
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # misc:vfr and misc:no_vfr_on_fullscreen were removed: variable refresh is
    # unconditional in current Hyprland, so naming them is a config error.
}

input {
    kb_layout = us
    follow_mouse = 1
}

# Escape hatch: the launcher is the whole UI, so there is exactly one binding
# that gets a human back to a shell when something goes wrong.
bind = SUPER SHIFT, T, exec, foot
bind = SUPER SHIFT, Q, exit
