# pacman.conf used by mkarchiso to build the image.
#
# multilib is enabled because Proton and every 32-bit Windows title need the
# lib32-* packages in packages.x86_64.

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
