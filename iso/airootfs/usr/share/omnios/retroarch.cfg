# OmniOS's RetroArch settings, laid over the user's own for games the launcher
# starts (retroarch --appendconfig=/usr/share/omnios/retroarch.cfg; see
# src/omnios/Router.cpp). RetroArch started any other way does not read this.

video_fullscreen = "true"
# The launcher raises itself over a game on the Guide button; the game waits
# rather than playing on behind it.
pause_nonactive = "true"

# Controllers through SDL, as in the launcher. RetroArch's default (udev)
# needs a profile per controller model from retroarch-joypad-autoconfig,
# which only the AUR has, so with it every pad was dead in every game. SDL's
# own database maps the common pads, and any pad without a profile gets
# RetroArch's built-in "Standard Gamepad" mapping, by position.
input_joypad_driver = "sdl2"

# The pause menu: Start + Select on a pad, Escape on a keyboard (Escape again
# resumes), rather than Escape quitting the game on the spot. Quitting is the
# game menu's (Meta, or Guide) or "Quit RetroArch" in this one.
input_menu_toggle_gamepad_combo = "4"
input_menu_toggle = "escape"
input_exit_emulator = "nul"
quit_press_twice = "false"
# "Close Content" in that menu ends RetroArch, back to OmniOS, rather than
# leaving RetroArch's own main menu on the screen.
quit_on_close_content = "1"

# The keyboard, in the layout every emulator OmniOS sets up shares
# (src/omnios/KeyboardLayout.h). RetroArch's defaults already have most of
# it: the arrows, Z X A S for the face buttons by position, Q W for L1 R1,
# Enter for Start. Added here: the triggers, both sticks, and Select on the
# left Shift rather than the right.
input_player1_select = "shift"
input_player1_l2 = "e"
input_player1_r2 = "r"
input_player1_l3 = "c"
input_player1_r3 = "v"
input_player1_l_y_minus = "i"
input_player1_l_x_minus = "j"
input_player1_l_y_plus = "k"
input_player1_l_x_plus = "l"
input_player1_r_y_minus = "t"
input_player1_r_x_minus = "f"
input_player1_r_y_plus = "g"
input_player1_r_x_plus = "h"
# RetroArch's own hotkeys on those keys, off, or a press meant for the game
# would slow it down (E), rewind it (R), fast-forward it (L), step a frame
# (K), switch to watching a netplay game (I), reset it (H), leave full
# screen (F) or change cheats (T).
input_hold_slowmotion = "nul"
input_rewind = "nul"
input_hold_fast_forward = "nul"
input_frame_advance = "nul"
input_netplay_game_watch = "nul"
input_reset = "nul"
input_toggle_fullscreen = "nul"
input_cheat_index_minus = "nul"

# The video context RetroArch picks by itself (Wayland here). Said here
# because retroarch-x11.cfg sets "x" for the Play! core alone, and
# config_save_on_exit (below) writes the merged settings back to the user's
# file: without this, every core after a PS2 game ran through X11.
video_context_driver = ""

# No desktop settings window. RetroArch builds its Qt one at startup even
# when it is never shown, and on a fresh configuration that crashed it
# (SIGSEGV in UIntComboBox::populate, from ui_companion_qt_init), so the
# first game anyone played on a new system closed at once. The menu above is
# the one a controller uses anyway.
ui_companion_enable = "false"
ui_companion_start_on_boot = "false"

# The menu's look; its assets are on the image (retroarch-assets-ozone).
menu_driver = "ozone"

# Settings changed in the menu while a game plays are kept in RetroArch's own
# file, not in this one, and these still win next time.
config_save_on_exit = "true"
