# Phase 1.4 (OmniOS.md §3.1.4). No login screen — tty1 comes up as root and
# .bash_profile takes over from there.
#
# The live image logs in as root because Phase 13.3's setup wizard is what
# creates the real user account. On an installed system this drop-in is
# rewritten with --autologin <user>.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \u' --noclear --autologin root - $TERM
