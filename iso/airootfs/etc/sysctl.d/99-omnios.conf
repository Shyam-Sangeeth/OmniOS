# Phase 4.3 (OmniOS.md §6.4.3).

# Keep game working sets in RAM; zram absorbs what has to go.
vm.swappiness = 10

# Proton, DXVK and several emulators map far more regions than the default
# 65530 allows. This is the value Fedora and SteamOS ship for the same reason.
vm.max_map_count = 2147483642

# Deeper queue for multiplayer traffic on fast links.
net.core.netdev_max_backlog = 16384

# Let games raise their own thread priority without root.
kernel.sched_autogroup_enabled = 1
