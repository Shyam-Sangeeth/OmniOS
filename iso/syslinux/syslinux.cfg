# BIOS boot menu. mkarchiso substitutes %INSTALL_DIR%, %ARCH% and
# %ARCHISO_LABEL% when it copies this onto the image, and generates
# isolinux/isolinux.cfg pointing here.
#
# The kernel and initramfs filenames carry the -linux-zen suffix because that
# is the kernel package in packages.x86_64. If the kernel is ever swapped
# (linux-cachyos, OmniOS.md §6.4.6), these two lines and the UEFI entry beside
# them are what change.

SERIAL 0 115200

# A menu, shown on every boot of the USB stick: Try or Install, the choice a
# live USB is for. It used to be hidden — PROMPT 0 and a two-second timeout,
# so a console just turned on and played — but a stick that can install itself
# has to say so before anything starts, and that is the only screen that comes
# before everything.
#
# vesamenu rather than menu.c32: menu.c32 draws in the text-mode palette, which
# is where the full-screen blue came from, while vesamenu takes 32-bit colours
# and so can use OmniOS's own. The colours are the launcher's: #0A0A12 behind,
# #6C63FF on the chosen line.
UI vesamenu.c32
MENU TITLE OmniOS
MENU BACKGROUND #ff0a0a12

MENU WIDTH 60
MENU MARGIN 10
MENU ROWS 8
MENU VSHIFT 6
MENU TABMSGROW 16
MENU CMDLINEROW 16
MENU TIMEOUTROW 18
MENU HELPMSGROW 20

MENU COLOR screen       0 #ff8888aa #ff0a0a12 none
MENU COLOR border       0 #00000000 #00000000 none
MENU COLOR title        0 #fff0f0f5 #00000000 none
MENU COLOR sel          0 #ffffffff #ff6c63ff none
MENU COLOR unsel        0 #ffc8c8d8 #00000000 none
MENU COLOR hotsel       0 #ffffffff #ff6c63ff none
MENU COLOR hotkey       0 #ffc8c8d8 #00000000 none
MENU COLOR disabled     0 #ff55556a #00000000 none
MENU COLOR scrollbar    0 #00000000 #00000000 none
MENU COLOR tabmsg       0 #ff8888aa #00000000 none
MENU COLOR cmdmark      0 #ff6c63ff #00000000 none
MENU COLOR cmdline      0 #fff0f0f5 #00000000 none
MENU COLOR timeout_msg  0 #ff8888aa #00000000 none
MENU COLOR timeout      0 #fff0f0f5 #00000000 none
MENU COLOR help         0 #ff8888aa #00000000 none

MENU AUTOBOOT Starting "Try OmniOS" in # second{,s}
MENU TABMSG Press Tab to edit the kernel command line

# Ten seconds (TIMEOUT is in tenths): long enough to read the list and move
# to Install, short enough that leaving the machine alone still gets somewhere.
PROMPT 0
TIMEOUT 100
DEFAULT omnios

# cow_spacesize is the size of the writable overlay the live session gets, and
# archiso's default of 256M is far too small for a machine with a store on it.
# Fetching Flathub's catalogue alone failed with:
#
#   Delta requires 86.4 MB free space, but only 84.8 MB available
#
# A fixed 2G was not enough either: opening Steam once fills it, because Steam
# downloads its own client on first run, and a full overlay means nothing
# starts at all — apps just fail, silently, with no clue why.
#
# 50% of RAM instead of a number, because the right size depends entirely on
# the machine. It is a tmpfs cap rather than a reservation, so it costs nothing
# until something writes. (It goes straight to "mount -o size=", which takes a
# percentage. The absolute form would be needed if this profile ever set
# cow_device, where archiso truncates a file to that size instead.)
LABEL omnios
    MENU LABEL Try OmniOS
    TEXT HELP
      Start OmniOS from this USB stick, with nothing on the machine changed.
      Anything saved or installed is gone when it turns off.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=50% archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false

# The same live system with the installer already open on the desktop.
# Closing it leaves the ordinary live session, so choosing Install is never a
# commitment — the disk is only touched from the installer's confirm screen.
# .bash_profile reads omnios.mode and nothing else does.
LABEL omnios-install
    MENU LABEL Install OmniOS
    TEXT HELP
      Start OmniOS and open the installer, to put it on a disk of its own.
      Nothing is erased until you choose a disk and confirm.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=50% archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false omnios.mode=install

# The live system in the tile launcher instead of on the desktop.
LABEL omnios-game
    MENU LABEL Try OmniOS in Game Mode
    TEXT HELP
      Start in the game library, for a controller, instead of the desktop.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=50% archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false omnios.mode=game

MENU SEPARATOR

LABEL omnios-safe
    MENU LABEL Safe graphics
    TEXT HELP
      For a machine whose screen stays black: starts without the graphics
      driver's own mode setting.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=50% archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off nomodeset

LABEL omnios-console
    MENU LABEL Console only, for troubleshooting
    TEXT HELP
      A text console with no desktop and no launcher.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND cow_spacesize=50% archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off omnios.nolauncher

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power off
    COM32 poweroff.c32
