# The live user. Hyprland refuses to run as root — as every wlroots compositor
# does — so the image cannot autologin to root and still reach the launcher.
#
# systemd-sysusers creates this at boot, which avoids shipping a whole
# /etc/passwd and /etc/shadow in the profile and having them drift out of sync
# with the filesystem package.
u omni 1000 "OmniOS" /home/omni /usr/bin/bash

# wheel for sudo; video/input/render for the GPU and controllers; seat for
# seatd, which is the fallback when logind has not set up a session.
m omni wheel
m omni video
m omni input
m omni render
m omni audio
m omni seat
# Serial ports are root:uucp 0660. Needed so the session can write its
# diagnostics to /dev/ttyS0, which is how a compositor that runs without
# output gets debugged from the host.
m omni uucp
