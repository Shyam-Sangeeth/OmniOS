# Live-medium hooks. Without the archiso hook the ISO boots to a kernel panic
# because nothing knows how to find and mount the squashfs.
# plymouth must sit right after udev so the splash is up before the root
# filesystem is found — that is the part of boot with nothing else on screen.
#
# The archiso_pxe_* hooks are gone. They netboot over NBD/HTTP, which a console
# does not do, and archiso_pxe_nbd needs nbd-client: absent from the package
# list, it failed every initramfs build with "binary not found: nbd-client"
# followed by "the image may not be complete".
HOOKS=(base udev plymouth modconf kms memdisk archiso archiso_loop_mnt block filesystems)
COMPRESSION="xz"
