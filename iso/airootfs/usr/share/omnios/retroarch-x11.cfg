# Laid over retroarch.cfg for the Play! core (PS2 without a BIOS) only; see
# src/omnios/Router.cpp, kPlayCore.
#
# Play! draws through GLX, so RetroArch makes an X11 (Xwayland) context for it.
# In RetroArch's native Wayland one the core found no GL functions ("No GLX
# display") and crashed on its first frame.
video_context_driver = "x"
