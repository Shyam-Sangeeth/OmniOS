# pacman.conf used by mkarchiso to build the image.
#
# multilib is enabled because Proton and every 32-bit Windows title need the
# lib32-* packages in packages.x86_64.

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
# OmniOS ships its own version of these (airootfs/etc), there before the
# packages that own them install. Unextracted, pacman leaves ours alone
# without writing the stock one beside it as a .pacnew and saying so in the
# build log (mkarchiso deleted the .pacnew files anyway).
NoExtract = etc/pacman.conf etc/locale.gen etc/plymouth/plymouthd.conf etc/skel/.bash_profile

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
