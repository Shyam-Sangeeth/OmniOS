# The power button behaves the way a console's does.
#
# systemd's default is that a tap on the power button shuts the machine down.
# That is right for a server and wrong for something under a television: the
# button you reach for when you have finished playing should put it to sleep,
# and the same button should wake it, so getting back to your game is one press
# rather than a boot.
#
# Holding it still powers off, which is the other half of what people already
# expect from every console they have owned.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
