# BIOS boot menu. mkarchiso substitutes %INSTALL_DIR%, %ARCH% and
# %ARCHISO_LABEL% when it copies this onto the image, and generates
# isolinux/isolinux.cfg pointing here.
#
# The kernel and initramfs filenames carry the -linux-zen suffix because that
# is the kernel package in packages.x86_64. If the kernel is ever swapped
# (linux-cachyos, OmniOS.md §6.4.6), these two lines and the UEFI entry beside
# them are what change.

SERIAL 0 115200
UI menu.c32

MENU TITLE OmniOS 0.1.0
MENU BACKGROUND
TIMEOUT 50
DEFAULT omnios

LABEL omnios
    MENU LABEL OmniOS (linux-zen)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL omnios-nomodeset
    MENU LABEL OmniOS (safe graphics)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off nomodeset

LABEL omnios-console
    MENU LABEL OmniOS (console only, no launcher)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off omnios.nolauncher

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power off
    COM32 poweroff.c32
