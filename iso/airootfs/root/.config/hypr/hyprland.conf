# Phase 3.3 (OmniOS.md §5.3.3). Hyprland exists here only to hold a Wayland
# surface for the launcher; the custom wlroots compositor replaces it later.
#
# Written against Hyprland 0.56, which is what the ISO ships. Options here were
# checked against a running instance — the first boot reported five config
# errors from syntax that older Hyprland accepted.
#
# KNOWN EXPIRY: Hyprland warns on startup that this .conf format loses support
# in 0.57, which moves to a Lua config. This file has to be ported before the
# image tracks that release; it is a rewrite, not a syntax tweak.

# Start the launcher inside a terminal directly, rather than letting the
# launcher find one for itself. Hyprland does not guarantee WAYLAND_DISPLAY is
# set in an exec-once child's environment, and the launcher used that variable
# to decide whether to open a terminal — so it silently wrote to a stdout that
# went nowhere and exited.
exec-once = omni-session

# If that fails, leave something on screen saying so instead of a blank desktop.
# pgrep -f, not -x. The kernel truncates a process's comm to 15 characters,
# so 'omni-launcher-qml' (17) is stored as 'omni-launcher-q' and an exact
# match never fires — the watchdog opened a second window on top of a shell
# that had started perfectly well. -f matches the full command line.
exec-once = sh -c 'sleep 8; pgrep -f omni-launcher-qml >/dev/null || pgrep -x foot >/dev/null || foot --app-id=omni-fallback sh -c "echo the shell did not start; echo; tail -40 /tmp/omnios-shell.log 2>/dev/null; exec bash"'

# A console switches to an app; it does not tile one beside the library.
#
# There are deliberately no window rules here. Two attempts at
# `windowrule = <rule>, class:...` were rejected by this Hyprland with
# "invalid field ...: missing a value", and its binary carries
# Config::Lua::Objects::CLuaWindowRule — the rule syntax is mid-migration to
# the Lua config that replaces .conf in 0.57. Guessing at it produces rules
# that silently do nothing.
#
# Instead the launcher switches to workspace 2 before it spawns anything, and
# Hyprland puts new windows on the active workspace. With gaps and borders at
# zero, that single window fills the screen and has nothing to resize against.
# The mechanism is hyprctl dispatch, whose syntax is stable and observable.
#
# The Windows key is the home button (OmniOS.md §12): it returns to the
# library and leaves the app alive on workspace 2. bindr fires on release,
# which is how a modifier-only key is bound.
# Switching the workspace is not enough: with follow_mouse the pointer has not
# moved, so Hyprland leaves nothing focused and the launcher receives no keys
# at all — arrows, Enter and Tab all dead until something is clicked. Focus the
# window explicitly. If the matcher is wrong the workspace switch still
# happens, so this degrades to the old behaviour rather than breaking.
bindr = SUPER, SUPER_L, exec, sh -c 'hyprctl dispatch workspace 1; hyprctl dispatch focuswindow class:omni-launcher'

# And back to whatever is running.
bind = SUPER, Tab, workspace, 2


general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0

    # These are nested blocks. Written inline as `blur { enabled = false }` on
    # one line, Hyprland does not parse them and reports the option as missing.
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    # 150ms tile focus, matching the UI spec in OmniOS.md §12.
    bezier = omni, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, omni
    animation = fade, 1, 3, omni
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # misc:vfr and misc:no_vfr_on_fullscreen were removed: variable refresh is
    # unconditional in current Hyprland, so naming them is a config error.
}

debug {
    # Hyprland otherwise stops logging to stdout a few lines in and continues
    # into /run/user/<uid>/hypr/<signature>/hyprland.log, where the signature
    # is random. That split is what hid the backend stage: the session log
    # ended at config parsing and looked like a hang. Keep it all in one place.
    disable_logs = false
    enable_stdout_logs = true
}

input {
    kb_layout = us
    follow_mouse = 1
}

# Escape hatch: the launcher is the whole UI, so there is exactly one binding
# that gets a human back to a shell when something goes wrong.
bind = SUPER SHIFT, T, exec, foot
bind = SUPER SHIFT, Q, exit
