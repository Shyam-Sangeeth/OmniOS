# Phase 1.4 (OmniOS.md §3.1.4). No login screen — tty1 comes up as the live
# user and .bash_profile takes over from there.
#
# This is 'omni', not root: Hyprland (and every wlroots compositor) refuses to
# run with superuser privileges, so a root autologin can never reach the
# launcher. Phase 13.3's setup wizard renames this account on install.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \u' --noclear --autologin omni - $TERM
