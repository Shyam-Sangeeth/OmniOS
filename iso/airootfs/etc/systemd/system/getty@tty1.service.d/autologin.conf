# Phase 1.4 (OmniOS.md §3.1.4). No login screen — tty1 comes up as the live
# user and .bash_profile takes over from there.
#
# This is 'omni', not root: Hyprland (and every wlroots compositor) refuses to
# run with superuser privileges, so a root autologin can never reach the
# launcher. Phase 13.3's setup wizard renames this account on install.
#
# Silently: --skip-login prints no "omnios login: omni (automatic login)",
# --noissue no /etc/issue banner, --nohints no Caps/Num Lock hints, and no
# --noclear, so the screen is cleared. That console is what shows between the
# boot splash quitting and the desktop's first frame (.bash_profile has to
# stop plymouth before Plasma can take the display), and it showed the
# banner and the login line there; now it is a moment of black.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \u' --skip-login --noissue --nohints --autologin omni - $TERM
